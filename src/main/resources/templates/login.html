<!DOCTYPE html>
<html lang="en" th:replace="~{base::parent(~{::#content})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <div id="content" class="grid place-items-center mt-14">
        <div class="bg-neutral-primary-soft block max-w-md w-full  p-6 border-t-4 border-blue-700 rounded-lg shadow-xl hover:bg-neutral-secondary-medium">
  
     <h5 class="mb-2 items-center dark:text-gray-950 text-2xl font-semibold tracking-tight text-heading leading-4">Login Here!</h5>
    <p class="font-normal   dark:text-gray-950 text-gray-200 ">Manage your contacts on cloud....</p>
    <div th:if="${param.error}" class="text-red-600 font-medium  mt-2 text-center">
			Invalid username and password!</div>
		<div th:if="${param.logout}" class="text-green-600 font-medium mt-2 text-center">
			You have been logged out!</div>
    <form
    th:action="@{/authenticate}"
    method="post"
    class="mt-2"
    >    
  <div class="relative z-0 w-full mb-4 mt-3 group">
      <input type="email" name="email" id="email" class="block py-2.5 px-0 w-full text-sm text-heading bg-transparent border-0 border-b-2 border-default-medium appearance-none focus:outline-none focus:ring-0 focus:border-brand peer" placeholder=" " required />
      <label for="email" class="absolute text-sm text-body duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">Email address</label>
      <!-- <p 
             th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}"
            class="text-red-600 font-light py-1">*Email is required</p> -->
    </div>
  <div class="relative z-0 w-full mb-5 group">
      <input type="password"  name="password" id="password" class="block py-2.5 px-0 w-full text-sm text-heading bg-transparent border-0 border-b-2 border-default-medium appearance-none focus:outline-none focus:ring-0 focus:border-brand peer" placeholder=" " required />
      <label for="password" class="absolute text-sm text-body duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">Password</label>
         <!-- <p 
             th:if="${#fields.hasErrors('password')}"
             th:errors="*{password}"
            class="text-red-600 font-light py-1">*Password is required</p> -->
    </div>
  <div class="mb-3 flex justify-center space-x-3">
    <button type="submit" class=" text-gray-900 dark:text-gray-100 
       bg-gray-400 dark:bg-gray-700 
       hover:bg-gray-500 dark:hover:bg-gray-900  rounded-xl bg-brand hover:bg-brand-strong box-border border border-transparent focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-3 py-2 focus:outline-none">LogIn</button>
   <button type="reset" class=" text-gray-900 dark:text-gray-100 
       bg-gray-400 dark:bg-gray-700 
       hover:bg-gray-500 dark:hover:bg-gray-900  rounded-xl bg-brand hover:bg-brand-strong box-border border border-transparent focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-3 py-2 focus:outline-none">Reset</button>
  
  
      </div>


    </form>
    </div>
    </div>
    
</body>
</html>
